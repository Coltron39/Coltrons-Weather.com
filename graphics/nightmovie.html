<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Alert - Night Movie</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 1920x1080 OBS Browser Source */
  .movie-frame {
    position: absolute;
    top: 158px;
    left: 64px;
    right: 64px;
    bottom: 104px;
    border: 2px solid rgba(53,200,255,.45);
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 18px 55px rgba(0,0,0,.45);
  }

  .movie-label {
    position: absolute;
    top: 18px;
    left: 22px;
    z-index: 3;
    padding: 8px 16px;
    background: rgba(226,0,26,.94);
    border-radius: 7px;
    font-family: var(--cond);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .movie-title {
    position: absolute;
    left: 28px;
    bottom: 22px;
    z-index: 3;
    padding: 10px 18px;
    background: rgba(3,10,28,.88);
    border-left: 5px solid var(--cyan);
    font-family: var(--cond);
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .movie-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.45);
    font-family: var(--cond);
    font-size: 42px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>

<body class="solid">
  <div id="header"></div>

  <div class="movie-frame">
    <div class="movie-label">LIVE NIGHT MOVIE</div>
    <div class="movie-title" id="movieTitle">GULLIVER'S TRAVELS</div>
    <div class="movie-placeholder">NIGHT MOVIE</div>
  </div>

  <div id="footer"></div>

<script src="wx.js"></script>
<script>
mountHeader('OVERNIGHT ENTERTAINMENT');
mountFooter('NIGHT MOVIE · FIRST ALERT WEATHER');

boot((d) => {
  const msgs = (d.periods || []).slice(0, 4)
    .map(x => `${x.name}: ${x.short}, ${x.temp}\u00b0`);

  const fm = document.getElementById('footmsg');
  if (fm && !fm.dataset.on && msgs.length) {
    fm.dataset.on = 1;
    rotate(fm, msgs, 6500);
  }
});
</script>
</body>
</html>
