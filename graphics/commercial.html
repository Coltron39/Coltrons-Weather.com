<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COMMERCIAL BREAK - Coltrons First Alert Weather</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ---------------- break slate ---------------- */
  .stage { position:absolute; inset:132px 0 74px; display:flex; align-items:center;
           justify-content:center; }

  .card { width:1240px; text-align:center; padding:38px 70px 34px;
          background:linear-gradient(180deg, rgba(13,42,92,.72), rgba(3,12,32,.86));
          border:2px solid rgba(53,200,255,.28); border-radius:34px;
          box-shadow:0 40px 120px rgba(0,0,0,.55); }

  .kicker { font-size:21px; font-weight:900; letter-spacing:10px; color:var(--cyan);
            margin-bottom:16px; }
  .card h1 { font-family:var(--cond); font-weight:800; font-size:96px; line-height:.9;
             text-transform:uppercase; letter-spacing:-1px; }
  .card h1 em { font-style:normal; color:var(--cyan); }

  .rule { width:280px; height:6px; margin:20px auto 18px; border-radius:3px;
          background:linear-gradient(90deg, var(--red), var(--cyan)); }

  .next { font-family:var(--cond); font-size:40px; font-weight:700; letter-spacing:5px;
          text-transform:uppercase; color:#dbe9ff; }
  .next b { color:var(--warm); }

  /* countdown clock */
  .clockrow { display:flex; align-items:center; justify-content:center; gap:26px;
              margin-top:26px; }
  .count { font-family:var(--cond); font-weight:800; font-size:84px; line-height:1;
           color:#fff; font-variant-numeric:tabular-nums; min-width:280px;
           text-shadow:0 8px 30px rgba(0,0,0,.6); }
  .count.soon { color:var(--warm); }
  .countlab { text-align:left; }
  .countlab span { display:block; font-size:19px; font-weight:900; letter-spacing:6px;
                   color:#8fb4e6; }
  .countlab span + span { margin-top:6px; color:#5f81b3; }

  /* progress */
  .track { width:100%; height:12px; margin-top:26px; border-radius:6px; overflow:hidden;
           background:rgba(255,255,255,.09); }
  .fill { height:100%; width:0%; border-radius:6px;
          background:linear-gradient(90deg, var(--cyan), var(--good));
          transition:width .9s linear; }

  /* now / next conditions strip */
  .strip { display:flex; justify-content:center; gap:18px; margin-top:24px; }
  .chip { display:flex; align-items:center; gap:16px; padding:16px 26px; border-radius:18px;
          background:rgba(3,12,32,.6); border:1px solid rgba(53,200,255,.22); }
  .chip .lab { font-size:15px; font-weight:900; letter-spacing:4px; color:#7f9ec9; }
  .chip .val { font-family:var(--cond); font-size:52px; font-weight:800; line-height:.9; }
  .chip .sm { font-size:17px; font-weight:800; letter-spacing:2px; color:#cfe2ff; }

  /* sponsor rail */
  .sponsors { margin-top:28px; padding-top:24px; text-align:center;
               border-top:1px solid rgba(255,255,255,.10); }
  .sponsors .lab { font-size:15px; font-weight:900; letter-spacing:7px; color:#7f9ec9;
                   margin-bottom:14px; }
  .sponsors .row { display:flex; justify-content:center; gap:14px; }
  .sponsors .s { padding:12px 24px; border-radius:12px; font-family:var(--cond);
                 font-size:26px; font-weight:700; letter-spacing:3px; color:#cfe2ff;
                 background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
                 text-transform:uppercase; }
</style>
</head>
<body class="solid">
  <div id="header"></div>

  <div class="stage">
    <div class="card">
      <div class="kicker">COLTRONS FIRST ALERT WEATHER</div>
      <h1>WE'LL BE<br><em>RIGHT BACK</em></h1>
      <div class="rule"></div>
      <div class="next">NEXT: <b id="nextseg">YOUR FIRST ALERT FORECAST</b></div>

      <div class="clockrow">
        <div class="count" id="count">2:00</div>
        <div class="countlab">
          <span>BACK ON AIR IN</span>
          <span id="cstate">STAND BY</span>
        </div>
      </div>

      <div class="track"><div class="fill" id="fill"></div></div>

      <div class="strip">
        <div class="chip">
          <span class="lab">NOW</span>
          <span id="nowicon"></span>
          <span class="val" id="nowtemp">--&deg;</span>
          <span class="sm" id="nowcond">--</span>
        </div>
        <div class="chip">
          <span class="lab">TONIGHT</span>
          <span class="sm" id="tonight">--</span>
        </div>
      </div>

      <div class="sponsors">
        <div class="lab">TONIGHT'S FORECAST BROUGHT TO YOU BY</div>
        <div class="row" id="sprow"></div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

<script src="wx.js"></script>
<script>
/* =====================================================================
   EDIT THESE
   ===================================================================== */
const BREAK_SECONDS = 120;                  // length of your break
const NEXT_SEGMENT  = "YOUR FIRST ALERT FORECAST";
const SPONSORS = [                          // rail across the bottom
  "RAPIDS HARDWARE",
  "RIVER CITY DINER",
  "NORTHWOODS AUTO",
  "WOOD COUNTY DAIRY"
];
/* ===================================================================== */

mountHeader();
mountFooter('COMMERCIAL BREAK - COLTRONS FIRST ALERT WEATHER RETURNS SHORTLY');
document.getElementById('nextseg').textContent = NEXT_SEGMENT;
document.getElementById('sprow').innerHTML =
  SPONSORS.map(s => `<div class="s">${s}</div>`).join('');

/* ---- countdown: restarts every time OBS shows this source ---- */
let left = BREAK_SECONDS;
const cEl = document.getElementById('count');
const sEl = document.getElementById('cstate');
const fEl = document.getElementById('fill');

function paint() {
  const m = Math.floor(Math.max(left, 0) / 60);
  const s = Math.max(left, 0) % 60;
  cEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
  cEl.classList.toggle('soon', left <= 15);
  fEl.style.width = (100 - (left / BREAK_SECONDS) * 100).toFixed(1) + '%';
  if (left <= 0)       sEl.textContent = 'COMING BACK NOW';
  else if (left <= 15) sEl.textContent = 'STAND BY - HOT MIC';
  else                 sEl.textContent = 'IN BREAK';
}
paint();
setInterval(() => { if (left > 0) { left--; paint(); } }, 1000);

/* ---- live conditions from wx.json ---- */
boot(data => {
  const p = data.primary || {};
  document.getElementById('nowicon').innerHTML = icon(p.icon, 54);
  const t = document.getElementById('nowtemp');
  t.textContent = (p.temp ?? '--') + '\u00B0';
  t.className = 'val ' + tempClass(p.temp);
  document.getElementById('nowcond').textContent = p.condition || '';
  const tn = (data.periods || []).find(x => !x.is_day) || (data.periods || [])[0];
  document.getElementById('tonight').textContent =
    tn ? `${tn.short || ''}, ${tn.temp ?? '--'}\u00B0` : '--';
});
</script>
</body>
</html>
