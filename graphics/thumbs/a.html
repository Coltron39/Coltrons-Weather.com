<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Thumb A</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden;background:#02060f;
            font-family:'Inter',Arial,sans-serif;color:#fff}
  #map{position:absolute;inset:0;filter:saturate(1.25) contrast(1.05)}
  .leaflet-container{background:#02060f}
  .scrim{position:absolute;inset:0;
    background:linear-gradient(100deg,rgba(2,7,20,.97) 0%,rgba(3,12,32,.92) 38%,
      rgba(3,12,32,.35) 62%,rgba(2,7,20,.55) 100%);}
  .vig{position:absolute;inset:0;box-shadow:inset 0 0 180px 60px rgba(0,0,0,.75)}
  .wrap{position:absolute;inset:0;padding:54px 60px 150px;display:flex;flex-direction:column;
        justify-content:center}
  .tag{display:inline-flex;align-items:center;gap:14px;margin-bottom:18px}
  .live{background:#e2001a;padding:9px 18px 8px;border-radius:6px;
        font-size:23px;font-weight:900;letter-spacing:4px;
        box-shadow:0 8px 28px rgba(226,0,26,.55)}
  .live i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#fff;
          margin-right:11px;vertical-align:1px}
  .where{font-family:'Barlow Condensed';font-size:34px;font-weight:700;letter-spacing:7px;
         color:#8fd8ff;text-shadow:0 3px 14px #000}
  h1{font-family:'Barlow Condensed';font-weight:800;text-transform:uppercase;
     line-height:.86;letter-spacing:-1px;text-shadow:0 10px 40px rgba(0,0,0,.9)}
  .l1{font-size:118px}
  .l2{font-size:150px;color:#ff2233;
      text-shadow:0 0 2px #fff,0 10px 40px rgba(0,0,0,.95)}
  .l3{font-size:150px}
  .rule{width:300px;height:8px;margin:26px 0 22px;border-radius:4px;
        background:linear-gradient(90deg,#e2001a,#35c8ff)}
  .sub{font-family:'Barlow Condensed';font-size:44px;font-weight:700;letter-spacing:4px;
       color:#dceaff;text-transform:uppercase;text-shadow:0 4px 18px #000}
  .temp{position:absolute;right:58px;top:52px;text-align:center;
        background:rgba(3,12,32,.72);border:3px solid rgba(53,200,255,.6);
        border-radius:22px;padding:20px 30px 16px;backdrop-filter:blur(3px);
        box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .temp b{display:block;font-family:'Barlow Condensed';font-size:124px;font-weight:800;
          line-height:.82;color:#7ff0a8}
  .temp b sup{font-size:56px;vertical-align:top;color:#35c8ff}
  .temp span{display:block;font-size:20px;font-weight:900;letter-spacing:3px;
             color:#bcd6f5;margin-top:8px}
  .logo{position:absolute;left:60px;bottom:44px;display:flex;align-items:center;gap:16px}
  .logo .c{width:64px;height:64px;border-radius:12px;background:#e2001a;
    display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';
    font-size:46px;font-weight:800;box-shadow:0 10px 30px rgba(226,0,26,.5)}
  .logo div{font-family:'Barlow Condensed';font-size:26px;font-weight:700;letter-spacing:4px;
            color:#cfe2ff}
</style></head>
<body>
<div id="map"></div>
<div class="scrim"></div><div class="vig"></div>

<div class="wrap">
  <div class="tag">
    <span class="live"><i></i>LIVE</span>
    <span class="where">WISCONSIN</span>
  </div>
  <h1 class="l1">COLTRONS</h1>
  <h1 class="l2">FIRST ALERT</h1>
  <h1 class="l3">WEATHER</h1>
  <div class="rule"></div>
  <div class="sub">TRACKING THE STATE, HOUR BY HOUR</div>
</div>

<div class="temp"><b>54<sup>&deg;</sup></b><span>WISCONSIN RAPIDS</span></div>

<div class="logo"><span class="c">C</span><div>WISCONSIN'S WEATHER AUTHORITY</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map',{zoomControl:false,attributionControl:false,zoomSnap:.05,
  dragging:false,scrollWheelZoom:false,keyboard:false});
map.fitBounds([[42.4,-93.2],[47.2,-86.6]],{paddingTopLeft:[520,0],paddingBottomRight:[10,40]});
L.tileLayer('https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:12,opacity:.85}).addTo(map);
L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png',
  {maxZoom:12,opacity:.95}).addTo(map);
fetch('../wi.geojson').then(r=>r.json()).then(gj=>{
  L.geoJSON(gj,{style:{color:'#ffffff',weight:6,fill:false,opacity:.95}}).addTo(map);
});
</script>
</body></html>
