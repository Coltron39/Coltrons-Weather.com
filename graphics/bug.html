<!DOCTYPE html>
<!-- OVERLAY: CORNER BUG / DOG (transparent)   1920x1080  - leave this on all show long -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Alert - Corner Bug</title>
<link rel="stylesheet" href="style.css">
<style>
  .bug { position:absolute; top:44px; right:52px; display:flex; align-items:stretch;
         border-radius:12px; overflow:hidden; box-shadow:0 16px 44px rgba(0,0,0,.5); }
  .bug .mark { width:66px; background:linear-gradient(160deg, var(--alert), #8f0010);
               display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .bug .mark .m1 { font-family:var(--cond); font-weight:700; font-size:30px; line-height:.86; }
  .bug .mark .m2 { font-family:var(--sans); font-size:8px; font-weight:800; letter-spacing:1.6px;
                   color:rgba(255,255,255,.85); margin-top:3px; }
  .bug .info { padding:12px 20px 12px 18px; background:rgba(3,10,28,.9);
               display:flex; align-items:center; gap:16px; }
  .bug .info .t { font-family:var(--cond); font-weight:700; font-size:48px; line-height:.9; }
  .bug .info .col .cl { font-family:var(--cond); font-size:26px; line-height:1;
                        font-variant-numeric:tabular-nums; }
  .bug .info .col .cd { font-family:var(--sans); font-size:10px; font-weight:800;
                        letter-spacing:2px; color:var(--ink-dim); margin-top:5px;
                        max-width:150px; white-space:nowrap; overflow:hidden;
                        text-overflow:ellipsis; }
  .flag { position:absolute; top:44px; right:52px; margin-top:0; }
  .alertchip { position:absolute; top:132px; right:52px; padding:9px 18px; border-radius:8px;
               background:var(--alert); font-family:var(--sans); font-size:13px; font-weight:800;
               letter-spacing:2.6px; display:none; animation:pulseAlert 1.8s infinite; }
  body.hasalert .alertchip { display:block; }
</style>
</head>
<body>
  <div class="bug">
    <div class="mark"><div class="m1">1st</div><div class="m1">ALRT</div><div class="m2">WX</div></div>
    <div class="info">
      <div id="ico"></div>
      <div class="t tabnum" id="temp">--&deg;</div>
      <div class="col">
        <div class="cl" id="clock">--:--</div>
        <div class="cd" id="city">--</div>
      </div>
    </div>
  </div>
  <div class="alertchip" id="chip">WEATHER ALERT</div>

<script src="wx.js"></script>
<script>
startClock();
boot((d) => {
  const p = d.primary || {};
  document.getElementById('temp').innerHTML = `${num(p.temp)}&deg;`;
  document.getElementById('temp').className = 't tabnum ' + tempClass(p.temp);
  document.getElementById('city').textContent = p.name || '';
  document.getElementById('ico').innerHTML = icon(p.icon || 'pcloudy', 44);

  const a = d.alerts || [];
  document.body.classList.toggle('hasalert', a.length > 0);
  if (a.length) document.getElementById('chip').textContent = a[0].event;
});
</script>
</body>
</html>
