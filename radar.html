<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coltrons First Alert Weather - Radar</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin="">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030a1c;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* Top station header */
.header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 118px;
  z-index: 1000;

  display: flex;
  align-items: center;
  gap: 18px;

  padding: 15px 28px;

  background:
    linear-gradient(
      180deg,
      rgba(3,10,28,.98),
      rgba(3,10,28,.82),
      rgba(3,10,28,0)
    );

  pointer-events: none;
}

.station-logo {
  width: 260px;
  height: 82px;
  object-fit: contain;
  object-position: left center;
}

.header-title {
  font-weight: 900;
  font-size: 28px;
  letter-spacing: 1px;
  text-shadow: 0 2px 8px #000;
}

.header-subtitle {
  margin-top: 4px;
  color: #8fa9cc;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 3px;
}

/* Bottom information bar */
.bottom-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 78px;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 28px;

  background: rgba(3,10,28,.94);
  border-top: 2px solid #35c8ff;

  pointer-events: none;
}

.bottom-left {
  font-size: 20px;
  font-weight: 900;
}

.bottom-center {
  color: #8fa9cc;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.bottom-right {
  font-size: 15px;
  font-weight: bold;
}

/* Rain / snow controls */
.controls {
  position: absolute;
  right: 20px;
  top: 135px;
  z-index: 2000;

  display: flex;
  gap: 8px;

  background: rgba(3,10,28,.9);
  padding: 8px;
  border: 1px solid #31517e;
  border-radius: 10px;
  box-shadow: 0 5px 20px #0008;
}

.controls button {
  border: 1px solid #31517e;
  background: #071634;
  color: white;
  padding: 9px 15px;
  border-radius: 7px;
  font-weight: 900;
  cursor: pointer;
}

.controls button:hover {
  border-color: #35c8ff;
}

.controls button.active {
  background: #14418c;
  border-color: #35c8ff;
}

/* Radar legend */
.legend {
  position: absolute;
  left: 20px;
  bottom: 98px;
  z-index: 2000;

  background: rgba(3,10,28,.92);
  border: 1px solid #31517e;
  border-radius: 9px;
  padding: 10px 13px;

  font-size: 11px;
  font-weight: bold;
}

.legend-title {
  margin-bottom: 7px;
  letter-spacing: 1px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 4px 0;
}

.swatch {
  width: 18px;
  height: 10px;
  border-radius: 2px;
}

/* Leaflet controls */
.leaflet-control-zoom {
  margin-top: 130px !important;
  margin-left: 18px !important;
}

.leaflet-control-attribution {
  background: rgba(0,0,0,.65) !important;
  color: #bbb !important;
}

.leaflet-control-attribution a {
  color: #8fdcff !important;
}

/* Mobile */
@media(max-width:800px) {
  .header {
    height: 90px;
    padding: 8px 12px;
  }

  .station-logo {
    width: 170px;
    height: 65px;
  }

  .header-title {
    font-size: 18px;
  }

  .header-subtitle {
    font-size: 8px;
    letter-spacing: 1px;
  }

  .controls {
    top: 98px;
    right: 10px;
  }

  .bottom-bar {
    height: 65px;
    padding: 0 12px;
  }

  .bottom-left {
    font-size: 14px;
  }

  .bottom-center {
    display: none;
  }

  .bottom-right {
    font-size: 11px;
  }

  .legend {
    bottom: 78px;
    left: 10px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- Station branding -->
<div class="header">
  <img
    class="station-logo"
    src="coltrons-logo.png"
    alt="Coltrons First Alert Weather"
  >

  <div>
    <div class="header-title">
      FIRST ALERT RADAR
    </div>

    <div class="header-subtitle">
      COLTRONS FIRST ALERT WEATHER
    </div>
  </div>
</div>

<!-- Rain / Snow controls -->
<div class="controls">
  <button id="rainBtn" class="active" onclick="setMode('rain')">
    RAIN
  </button>

  <button id="snowBtn" onclick="setMode('snow')">
    SNOW
  </button>
</div>

<!-- Legend -->
<div class="legend">
  <div class="legend-title" id="legendTitle">
    RAIN INTENSITY
  </div>

  <div class="legend-row">
    <span class="swatch" style="background:#35c8ff"></span>
    Light
  </div>

  <div class="legend-row">
    <span class="swatch" style="background:#35d35a"></span>
    Moderate
  </div>

  <div class="legend-row">
    <span class="swatch" style="background:#ffe600"></span>
    Heavy
  </div>

  <div class="legend-row">
    <span class="swatch" style="background:#ff7a00"></span>
    Very Heavy
  </div>

  <div class="legend-row">
    <span class="swatch" style="background:#ff1744"></span>
    Extreme
  </div>
</div>

<!-- Bottom station bar -->
<div class="bottom-bar">
  <div class="bottom-left">
    FIRST ALERT RADAR
  </div>

  <div class="bottom-center">
    WEATHER • RADAR • CONDITIONS
  </div>

  <div class="bottom-right" id="updated">
    RADAR DATA
  </div>
</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin="">
</script>

<script>
/* =========================================================
   COLTRONS FIRST ALERT WEATHER
   KEYLESS RADAR MAP
   ========================================================= */

/*
   IMPORTANT:
   This version contains NO CARTO API KEY.
   The basemap uses CARTO's public raster tiles directly.
*/

/* Wisconsin-centered map */
const map = L.map("map", {
  zoomControl: true,
  attributionControl: true
}).setView([44.5, -89.5], 7);

/* =========================================================
   KEYLESS DARK BASEMAP
   ========================================================= */

const darkMap = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {
    subdomains: "abcd",
    maxZoom: 20,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }
);

darkMap.addTo(map);

/* =========================================================
   RADAR DATA
   ========================================================= */

/*
   NOAA / Iowa Environmental Mesonet radar composite.

   This does NOT require a personal API key.
*/

let radarLayer = null;
let currentMode = "rain";

/*
   Radar image layer.

   The service may change its available imagery over time.
   Keeping this separate from the basemap means the map itself
   remains usable even if radar imagery is temporarily unavailable.
*/

function createRadarLayer() {

  if (radarLayer) {
    map.removeLayer(radarLayer);
    radarLayer = null;
  }

  /*
     NEXRAD composite reflectivity image from IEM.
  */

  const radarUrl =
    "https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi" +
    "?service=WMS" +
    "&version=1.1.1" +
    "&request=GetMap" +
    "&layers=nexrad-n0r-900913" +
    "&styles=default" +
    "&format=image/png" +
    "&transparent=true" +
    "&width=256" +
    "&height=256" +
    "&srs=EPSG:3857" +
    "&bbox={bbox-epsg-3857}";

  radarLayer = L.tileLayer.wms(
    "https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi",
    {
      layers: "nexrad-n0r-900913",
      format: "image/png",
      transparent: true,
      opacity: 0.72,
      attribution: "Radar: Iowa Environmental Mesonet / NOAA"
    }
  );

  radarLayer.addTo(map);
}

createRadarLayer();

/* =========================================================
   RAIN / SNOW MODE
   ========================================================= */

function setMode(mode) {

  currentMode = mode;

  document
    .getElementById("rainBtn")
    .classList.toggle("active", mode === "rain");

  document
    .getElementById("snowBtn")
    .classList.toggle("active", mode === "snow");

  const title = document.getElementById("legendTitle");

  if (mode === "snow") {
    title.textContent = "SNOW / WINTER WEATHER";

    /*
       Radar reflectivity itself does not identify precipitation
       type. This mode changes the presentation label rather than
       pretending the radar can determine rain vs snow by itself.
    */
  } else {
    title.textContent = "RAIN INTENSITY";
  }
}

/* =========================================================
   UPDATED CLOCK
   ========================================================= */

function updateTime() {

  const now = new Date();

  const time = now.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit"
  });

  document.getElementById("updated").textContent =
    "UPDATED " + time;
}

updateTime();
setInterval(updateTime, 1000);

/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener("resize", () => {
  map.invalidateSize();
});
</script>

</body>
</html>
