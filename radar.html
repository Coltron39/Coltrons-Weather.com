<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>First Alert - Radar</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="style.css">

<style>
#map {
  position:absolute;
  top:132px;
  left:0;
  right:0;
  bottom:74px;
  background:#02060f;
}

.leaflet-container {
  background:#02060f !important;
}

.leaflet-control-attribution {
  display:none;
}

#header,
#footer {
  z-index:900;
}

.overlay {
  position:absolute;
  pointer-events:none;
  z-index:850;
}

.titlecard {
  top:172px;
  left:56px;
  padding:22px 30px;
}

.titlecard h1 {
  font-family:var(--cond);
  font-weight:700;
  font-size:62px;
  line-height:.92;
  text-transform:uppercase;
}

.titlecard .k {
  font-family:var(--sans);
  font-size:13px;
  font-weight:800;
  letter-spacing:4px;
  color:var(--cyan);
  margin-bottom:8px;
}

.legend {
  bottom:110px;
  left:56px;
  padding:20px 24px;
}

.legend .label {
  margin-bottom:12px;
}

.legend .scale {
  width:400px;
  height:16px;
  border-radius:3px;
  background:linear-gradient(
    90deg,
    #00c6a2,
    #00a2ff 14%,
    #00e13c 30%,
    #f6ff00 50%,
    #ff9c00 66%,
    #ff2200 80%,
    #c400ff
  );
}

.legend .ticks {
  display:flex;
  justify-content:space-between;
  width:400px;
  margin-top:8px;
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.6px;
  color:var(--ink-dim);
}

.loop {
  bottom:110px;
  right:56px;
  padding:18px 24px;
  text-align:right;
}

.loop .frame {
  font-family:var(--cond);
  font-weight:700;
  font-size:46px;
  line-height:1;
}

.loop .bars {
  display:flex;
  gap:5px;
  justify-content:flex-end;
  margin-top:12px;
}

.loop .bars i {
  width:20px;
  height:6px;
  border-radius:3px;
  background:rgba(255,255,255,.2);
}

.loop .bars i.on {
  background:var(--cyan);
}

.alertstrip {
  top:132px;
  left:0;
  right:0;
  height:56px;
  display:none;
  align-items:center;
  gap:18px;
  padding:0 56px;
  background:var(--alert);
}

body.hasalert .alertstrip {
  display:flex;
}

.alertstrip .l {
  font-family:var(--sans);
  font-size:13px;
  font-weight:800;
  letter-spacing:3px;
}

.alertstrip .v {
  font-family:var(--cond);
  font-size:32px;
  letter-spacing:.6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.leaflet-container {
  background:#00040a !important;
}

.panel {
  background:rgba(0,4,10,.90) !important;
  border-color:rgba(255,255,255,.10) !important;
}

/* =========================================================
   LOCK THE MAP
   ========================================================= */

.leaflet-grab,
.leaflet-grabbing {
  cursor:default !important;
}

.leaflet-container {
  cursor:default !important;
}

/* Prevent the map from being moved by touch */
#map {
  touch-action:none;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="header"></div>

<div class="overlay alertstrip">
  <span class="l">FIRST ALERT</span>
  <span class="v" id="astrip"></span>
</div>

<div class="overlay titlecard panel panel-accent">
  <div class="k">First Alert</div>
  <h1>Doppler Radar</h1>
</div>

<div class="overlay legend panel" id="legend">
  <div class="label" id="legendLabel">
    Rainfall Reflectivity
  </div>

  <div class="scale"></div>

  <div class="ticks" id="legendTicks">
    <span>LIGHT</span>
    <span>MODERATE</span>
    <span>HEAVY</span>
    <span>SEVERE</span>
  </div>
</div>

<div class="overlay loop panel" id="loopPanel">
  <div class="frame" id="frame">-- MIN AGO</div>

  <div class="bars" id="bars"></div>
</div>

<div id="footer"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="wx.js"></script>

<script>

/* =========================================================
   CARTO API KEY
   =========================================================

   PUT YOUR CARTO KEY BETWEEN THE QUOTATION MARKS.

   Example:

   const CARTO_API_KEY = "cb1_3qog_2_d109f0b6c16b560a67dccd7b";

   ========================================================= */

const CARTO_API_KEY = "PASTE_YOUR_CARTO_API_KEY_HERE";


/* =========================================================
   HEADER / FOOTER
   ========================================================= */

mountHeader();
mountFooter('');


/* =========================================================
   MAP
   =========================================================

   THE MAP IS PERMANENTLY LOCKED.

   dragging: false
   scrollWheelZoom: false
   doubleClickZoom: false
   keyboard: false
   touchZoom: false
   boxZoom: false
   zoomControl: false

   ========================================================= */

const map = L.map('map', {

  zoomControl: false,

  attributionControl: false,

  zoomSnap: 0.1,

  dragging: false,

  scrollWheelZoom: false,

  doubleClickZoom: false,

  keyboard: false,

  touchZoom: false,

  boxZoom: false,

  tap: false

});


/* =========================================================
   LOCK ALL MAP MOVEMENT
   ========================================================= */

map.dragging.disable();
map.scrollWheelZoom.disable();
map.doubleClickZoom.disable();
map.touchZoom.disable();
map.boxZoom.disable();
map.keyboard.disable();


/* =========================================================
   WISCONSIN MAP VIEW
   ========================================================= */

map.fitBounds(
  [
    [42.40, -93.20],
    [47.20, -86.60]
  ],
  {
    paddingTopLeft: [430, 90],
    paddingBottomRight: [430, 120]
  }
);


/* =========================================================
   CARTO DARK BASEMAP
   ========================================================= */

const cartoUrl =
  'https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png' +
  '?key=' + encodeURIComponent(CARTO_API_KEY);

L.tileLayer(
  cartoUrl,
  {
    maxZoom:20,
    opacity:0.9,
    attribution:'© OpenStreetMap contributors, © CARTO'
  }
).addTo(map);


/* =========================================================
   RADAR LOOP
   ========================================================= */

const OFFSETS = [
  50,
  45,
  40,
  35,
  30,
  25,
  20,
  15,
  10,
  5,
  0
];


/* =========================================================
   CREATE RADAR LAYERS
   ========================================================= */

function makeRainLayers() {

  return OFFSETS.map(minutes => {

    const suffix =
      minutes === 0
        ? ''
        : '-m' + String(minutes).padStart(2, '0') + 'm';

    return L.tileLayer(

      'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/' +
      'nexrad-n0q-900913' +
      suffix +
      '/{z}/{x}/{y}.png',

      {
        opacity:0,
        maxZoom:12,
        interactive:false
      }

    ).addTo(map);

  });

}


const rainLayers = makeRainLayers();


/* =========================================================
   WISCONSIN OUTLINE
   ========================================================= */

fetch('wi.geojson')

  .then(response => response.json())

  .then(geojson => {

    L.geoJSON(
      geojson,
      {
        style: {
          color:'#8fd8ff',
          weight:2.5,
          fill:false,
          opacity:0.95
        },

        interactive:false
      }

    ).addTo(map);

  })

  .catch(() => {});


/* =========================================================
   CITY MARKERS
   ========================================================= */

const MARKS = [

  ['WISCONSIN RAPIDS',44.3836,-89.8173,true],

  ['MILWAUKEE',43.0389,-87.9065,false],

  ['MADISON',43.0731,-89.4012,false],

  ['GREEN BAY',44.5133,-88.0133,false],

  ['WAUSAU',44.9591,-89.6301,false],

  ['EAU CLAIRE',44.8113,-91.4985,false],

  ['LA CROSSE',43.8014,-91.2396,false]

];


MARKS.forEach(
  ([name,lat,lon,highlight]) => {

    L.marker(
      [lat,lon],
      {
        interactive:false,

        icon:L.divIcon({

          className:'',

          iconSize:[0,0],

          html:

            '<div style="' +

            'transform:translate(-50%,-50%);' +

            'white-space:nowrap;' +

            'display:flex;' +

            'align-items:center;' +

            'gap:7px;' +

            'font-family:Arial,sans-serif;' +

            'font-size:' +
            (highlight ? 15 : 12) +
            'px;' +

            'font-weight:800;' +

            'letter-spacing:1.6px;' +

            'color:' +
            (highlight
              ? '#fff'
              : 'rgba(255,255,255,.72)') +
            ';' +

            'text-shadow:0 2px 8px #000' +

            '">' +

            '<span style="' +

            'width:' +
            (highlight ? 12 : 7) +
            'px;' +

            'height:' +
            (highlight ? 12 : 7) +
            'px;' +

            'border-radius:50%;' +

            'background:' +
            (highlight ? '#e2001a' : '#fff') +

            '">' +

            '</span>' +

            name +

            '</div>'

        })

      }

    ).addTo(map);

  }
);


/* =========================================================
   RADAR LOOP BAR
   ========================================================= */

document.getElementById('bars').innerHTML =
  OFFSETS.map(() => '<i></i>').join('');


const bars =
  [...document.querySelectorAll('#bars i')];


let frameIndex = 0;


/* =========================================================
   DISPLAY RADAR FRAME
   ========================================================= */

function renderRadar() {

  rainLayers.forEach(
    (layer,index) => {

      layer.setOpacity(
        index === frameIndex
          ? 0.82
          : 0
      );

    }
  );


  bars.forEach(
    (bar,index) => {

      bar.classList.toggle(
        'on',
        index <= frameIndex
      );

    }
  );


  const minutes =
    OFFSETS[frameIndex];


  document.getElementById('frame').textContent =

    minutes === 0

      ? 'CURRENT'

      : '-' + minutes + ' MIN';

}


/* =========================================================
   PLAY RADAR LOOP
   ========================================================= */

function stepRadar() {

  renderRadar();

  frameIndex =
    (frameIndex + 1) %
    OFFSETS.length;

  setTimeout(

    stepRadar,

    frameIndex === 0
      ? 1400
      : 420

  );

}


setTimeout(
  stepRadar,
  1200
);


/* =========================================================
   REFRESH RADAR DATA
   ========================================================= */

setInterval(
  () => {

    rainLayers.forEach(
      layer => layer.redraw()
    );

  },
  240000
);


/* =========================================================
   WEATHER / ALERT DATA
   ========================================================= */

boot(
  data => {

    const alerts =
      data.alerts || [];


    document.body.classList.toggle(
      'hasalert',
      alerts.length > 0
    );


    if (alerts.length) {

      document.getElementById(
        'astrip'
      ).textContent =

        alerts
          .map(
            x =>
              x.event +
              ': ' +
              x.areas
          )
          .join(
            '   •   '
          );

    }


    const footerMessage =
      document.getElementById('footmsg');


    if (footerMessage) {

      footerMessage.textContent =

        alerts.length

          ? alerts[0].event +
            ' · ' +
            alerts[0].areas.slice(0,80)

          : 'RADAR LOOP · LAST 50 MINUTES · NO ACTIVE WARNINGS';

    }

  }
);

</script>

</body>
</html>
